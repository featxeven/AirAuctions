# AirAuctions - Commands Configuration
# Docs: https://airdevelopment.gitbook.io/docs/

# --------------------------------------------------
# SHORTCUTS
# Maps a short alias to a full command string.
#
# Requires restart to reflect changes.
# --------------------------------------------------
shortcuts:
  auction:
    runs: "ah sell"
    aliases: []

  bid:
    runs: "ah bid"
    aliases: []

# --------------------------------------------------
# DURATION UNITS
# Suffixes accepted by duration arguments.
# --------------------------------------------------
duration-units:
  # A value typed with no suffix (e.g. "200") uses whichever unit is listed
  # first in this section (or filtered in command tab-complete).
  t:
    ticks: 1
  s:
    ticks: 20
  m:
    ticks: 1200
  h:
    ticks: 72000
  d:
    ticks: 1728000
  w:
    ticks: 12096000

# --------------------------------------------------
# MAIN COMMAND
# Requires restart to reflect changes.
# --------------------------------------------------
main:
  name: "auctionhouse"
  aliases: [ah]
  usage: "/%label% [subcommand] [...]"

# --------------------------------------------------
# SUBCOMMANDS
# --------------------------------------------------
subcommands:

  sell:
    enabled: true
    name: "sell"
    aliases: []
    usage: "/%label% %sublabel% <price> [amount] [economy]"
    tab-complete:
      1:
        sources: [100, 500, 1000, 5000, 10000]
        requires: airauctions.command.sell
      2:
        sources: [1, 5, 10, 16, 32, 64]
        requires: airauctions.command.sell
      3:
        sources: [ECONOMY_OPTIONS]
        requires: airauctions.command.sell

  bid:
    enabled: true
    name: "bid"
    aliases: []
    usage: "/%label% %sublabel% <initial-price> [duration] [amount] [economy]"
    tab-complete:
      1:
        sources: [100, 500, 1000, 5000, 10000]
        requires: airauctions.command.bid
      2:
        sources: [DURATION_UNITS:<s, m, h, d>]
        suffix-mode: true
        requires: airauctions.command.bid
      3:
        sources: [1, 5, 10, 16, 32, 64]
        requires: airauctions.command.bid
      4:
        sources: [ECONOMY_OPTIONS]
        requires: airauctions.command.bid

  listings:
    enabled: true
    name: "listings"
    aliases: []
    usage: "/%label% %sublabel%"
    usage-others: "/%label% %sublabel% [player]"
    tab-complete:
      1:
        sources: [ONLINE_PLAYERS:20]
        requires: airauctions.command.listings.others

  expired:
    enabled: true
    name: "expired"
    aliases: []
    usage: "/%label% %sublabel%"
    usage-others: "/%label% %sublabel% [player]"
    tab-complete:
      1:
        sources: [ONLINE_PLAYERS:20]
        requires: airauctions.command.expired.others

  history:
    enabled: true
    name: "history"
    aliases: []
    usage: "/%label% %sublabel%"
    usage-others: "/%label% %sublabel% [player]"
    tab-complete:
      1:
        sources: [ONLINE_PLAYERS:20]
        requires: airauctions.command.history.others

  storage:
    enabled: true
    name: "storage"
    aliases: []
    usage: "/%label% %sublabel%"
    usage-others: "/%label% %sublabel% [player]"
    tab-complete:
      1:
        sources: [ONLINE_PLAYERS:20]
        requires: airauctions.command.storage.others

  search:
    enabled: true
    name: "search"
    aliases: []
    usage: "/%label% %sublabel% <query>"
    tab-complete: []

  player:
    enabled: true
    name: "player"
    aliases: []
    usage: "/%label% %sublabel% <player>"
    tab-complete:
      1:
        sources: [ONLINE_PLAYERS:20]
        requires: airauctions.command.player

  open:
    enabled: true
    name: "open"
    aliases: []
    usage: "/%label% %sublabel% <gui-id> <player> [category] [type] [economy] [sort] [target]"
    tab-complete:
      1:
        sources: [GUI_IDS]
        requires: airauctions.command.open
      2:
        sources: [ONLINE_PLAYERS:20]
        requires: airauctions.command.open
      3:
        sources: [FILTER_CATEGORIES]
        requires: airauctions.command.open
      4:
        sources: [FILTER_TYPES]
        requires: airauctions.command.open
      5:
        sources: [FILTER_ECONOMIES]
        requires: airauctions.command.open
      6:
        sources: [SORT]
        requires: airauctions.command.open
      7:
        sources: [ONLINE_PLAYERS:20]
        requires: airauctions.command.open

  delete:
    enabled: true
    name: "delete"
    aliases: []
    usage: "/%label% %sublabel% <id>"
    tab-complete:
      1:
        sources: [LISTING_IDS:20]
        requires: airauctions.command.delete

  slots:
    enabled: true
    name: "slots"
    aliases: []
    usage: "/%label% %sublabel% <action> <amount> [player]"
    actions:
      give: "give"
      take: "take"
    tab-complete:
      1:
        sources: [ACTIONS]
        requires: airauctions.command.slots
      2:
        sources: [1, 5, 10, 25, 50]
        requires: airauctions.command.slots
      3:
        sources: [ONLINE_PLAYERS:20]
        requires: airauctions.command.slots