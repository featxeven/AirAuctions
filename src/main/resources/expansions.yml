  time-format: RELATIVE

  events:

    # --------------------------------------------------
    # LISTINGS
    # --------------------------------------------------
    listing-deleted:
      enabled: false
      webhook-url: ""                # Override the global webhook-url for this event only. Blank = inherit.
      time-format: ""                # Override the global time-format for this event only. Blank = inherit.
      color: 15158332                # #E74C3C red

      author:
        name: ""
        icon-url: ""
        url: ""

      title: "Listing Deleted by Admin"
      title-url: ""
      description: "**%player%**'s listing of **x%amount% %item%** was removed by **%admin%**."

      thumbnail-url: "https://mc-heads.net/avatar/%player%/64"
      image-url: ""

      fields:
        - name: "Item"
          value: "%item%"
          inline: true
        - name: "Amount"
          value: "%amount%"
          inline: true
        - name: "Price"
          value: "%price%"
          inline: true
        - name: "Economy"
          value: "%economy%"
          inline: true
        - name: "Deleted by"
