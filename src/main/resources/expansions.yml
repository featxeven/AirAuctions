# AirAuctions - Expansions Configuration
# Docs: https://airdevelopment.gitbook.io/docs/

# --------------------------------------------------
# ECONOMY
# --------------------------------------------------
economy:

  # --- Number display ---
  # How amounts are displayed across messages, placeholders, and GUIs
  # SHORT      - 1250000   > 1.25M
  # FORMATTED  - 1250000   > 1,250,000
  # RAW        - 1250000   > 1250000
  number-format: FORMATTED
  number-format-suffixes: ["", "k", "M", "B", "T", "Q"]
  allow-shorthand-input: true        # Allow shorthand in commands (e.g. /ah sell 1.5k instead of 1500)

  # --- Decimal handling ---
  # Only applies when allow-decimals: false on a provider.
  # FLOOR   - silently truncate to the nearest whole number
  # REJECT  - treat decimal prices as invalid
  decimal-handling: REJECT

  # --- Price constraints ---
  min-price: 1
  max-price: 10000000                # -1 = no limit

  # --- Purchase check ---
  # Controls the funds check when a player initiates a purchase.
  # MINIMUM  - player needs only enough for the minimum partial amount (based on min-partial-price)
  # FULL     - player must have the full listing price to open the buy_amount GUI
  buy-check: MINIMUM
  buy-amount-trigger: 2              # Minimum listing amount to open buy_amount instead of buy. Must be >= 2
  min-partial-price: 1               # Minimum total price for a partial purchase (prevents sub-cent prorated costs)

  # --- Currency ---
  multi-currency: true               # When false, only the default provider is used and [economy] args are ignored
  default-currency: "vault"

  # --------------------------------------------------
  # PROVIDERS
  # --------------------------------------------------
  # Supported types:
  #   VAULT            - requires Vault + a compatible economy plugin
  #   EXP              - uses player experience points (no plugin required)
  #   PLACEHOLDER      - custom provider via PAPI placeholder + console commands
  #   PLAYERPOINTS     - requires PlayerPoints
  #   EXCELLENTECONOMY - requires ExcellentEconomy
  #
  # Order controls the cycle order in the economy filter menu.
  # The 'all' entry is reserved and represents no filter (shows all economies).
  # It can be placed anywhere in the list to control where it appears in the cycle.
  providers:

    all:
      display-name: "All"

    vault:
      enabled: true
      type: VAULT
      # Used for ECONOMY_OPTIONS tab-complete source
      key: "Money"
      # Used for %economy% placeholders
      display-name: "<green>Money</green>"
      format: "<green>$%amount%</green>"
      allow-decimals: true

    exp:
      enabled: true
      type: EXP
      key: "Experience"
      display-name: "<aqua>Experience</aqua>"
      format: "<aqua>%amount% XP</aqua>"
      allow-decimals: false

    points:
      enabled: false
      type: PLAYERPOINTS
      key: "Points"
      display-name: "<yellow>Points</yellow>"
      format: "<yellow>%amount% Points</yellow>"
      allow-decimals: false

    coins:
      enabled: false
      type: EXCELLENTECONOMY
      key: "Coins"
      display-name: "<gold>Coins</gold>"
      format: "<gold>%amount% Coins</gold>"
      allow-decimals: true
      settings:
        currency: "coins"   # must match a currency ID configured in ExcellentEconomy's own currencies/*.yml

    crystals:
      enabled: false
      type: PLACEHOLDER
      key: "Crystals"
      display-name: "<gold>Crystals</gold>"
      format: "<gold>%amount% Crystals</gold>"
      allow-decimals: false
      settings:
        balance-placeholder: "%mycurrency_balance%"
        give-command: "mycurrency give %player% %amount%"
        take-command: "mycurrency take %player% %amount%"

  # --------------------------------------------------
  # LISTING FEE
  # Charged to the seller when a listing is created.
  # --------------------------------------------------
  listing-fee:
    enabled: true
    type: PERCENTAGE                 # PERCENTAGE of asking price | FIXED flat amount
    default: 5                       # Default value: 5% or $5. Override: airauctions.bypass.fee.<value>
    min: 1                           # Minimum charge. Ignored when type is FIXED
    max: 1000                        # Maximum charge. -1 = no cap. Ignored when type is FIXED

  # --------------------------------------------------
  # SALES TAX
  # Deducted from the seller's payout when a sale completes.
  # --------------------------------------------------
  sales-tax:
    enabled: true
    type: PERCENTAGE                 # PERCENTAGE of sale price | FIXED flat amount
    default: 10                      # Default value: 10% or $10. Override: airauctions.bypass.tax.<value>
    min: 1                           # Minimum tax. Ignored when type is FIXED
    max: 1000                        # Maximum tax. -1 = no cap. Ignored when type is FIXED

# --------------------------------------------------
# DISCORD
# Sends webhook embeds to a Discord channel on
# configurable events. Placeholders supported in
# all text fields.
# --------------------------------------------------
discord:
  enabled: false
  webhook-url: ""

  # RELATIVE            - "in a day"
  # DATETIME            - "August 12, 2026 at 7:42 PM"
  # DATETIME_RELATIVE   - "August 12, 2026 at 7:42 PM (in a day)"
