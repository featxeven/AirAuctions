name: AirAuctions
main: com.ftxeven.airauctions.AirAuctions
version: 2.1.3
api-version: '1.21'
author: ftxeven
description: A modern, highly-customizable Auction House GUI.
folia-supported: true

softdepend:
  - Vault
  - PlaceholderAPI
  - Nexo
  - ItemsAdder
  - CraftEngine
  - PlayerPoints
  - ExcellentEconomy

commands:
  airauctions:
    description: Plugin management command.
    aliases: []
    usage: /airauctions reload|version|simulate
    permission: airauctions.admin

permissions:
  airauctions.admin:
    description: Grants all AirAuctions permissions.
    default: op
    children:
      airauctions.command.*: true
      airauctions.bypass.*: true

  airauctions.use:
    description: Grants all standard user permissions.
    default: op
    children:
      airauctions.command.sell: true
      airauctions.command.bid: true
      airauctions.command.listings: true
      airauctions.command.storage: true
      airauctions.command.expired: true
      airauctions.command.history: true
      airauctions.command.search: true
      airauctions.command.player: true

  airauctions.command.*:
    description: Grants all command permissions.
    default: op
    children:
      airauctions.command.sell: true
      airauctions.command.bid: true
      airauctions.command.delete: true
      airauctions.command.slots: true
      airauctions.command.open: true
      airauctions.command.storage: true
      airauctions.command.storage.others: true
      airauctions.command.listings: true
      airauctions.command.listings.others: true
      airauctions.command.expired: true
      airauctions.command.expired.others: true
      airauctions.command.history: true
      airauctions.command.history.others: true
      airauctions.command.search: true
      airauctions.command.player: true

  airauctions.command.sell:
    description: Allows creating listings via /ah sell.
    default: op

  airauctions.command.bid:
    description: Allows creating bid listings via /ah bid.
    default: op

  airauctions.command.delete:
    description: Allows deleting any listing via /ah delete.
    default: op

  airauctions.command.slots:
    description: Allows giving or taking extra listing slots from players.
    default: op

  airauctions.command.open:
    description: Allows opening a specific GUI.
    default: op

  airauctions.command.storage:
    description: Allows viewing own storage.
    default: op

  airauctions.command.storage.others:
    description: Allows viewing another player's storage.
    default: op

  airauctions.command.listings:
    description: Allows viewing own active listings.
    default: op

  airauctions.command.listings.others:
    description: Allows viewing another player's active listings.
    default: op

  airauctions.command.expired:
    description: Allows viewing own expired listings.
    default: op

  airauctions.command.expired.others:
    description: Allows viewing another player's expired listings.
    default: op

  airauctions.command.history:
    description: Allows viewing own transaction history.
    default: op

  airauctions.command.history.others:
    description: Allows viewing another player's transaction history.
    default: op

  airauctions.command.search:
    description: Allows searching listings via /ah search.
    default: op

  airauctions.command.player:
    description: Allows viewing another player's active listings.
    default: op

  airauctions.bypass.*:
    description: Grants all bypass permissions.
    default: op
    children:
      airauctions.bypass.limit: true
      airauctions.bypass.expire-time: true
      airauctions.bypass.duration-time: true
      airauctions.bypass.gamemodes: true
      airauctions.bypass.worlds: true
      airauctions.bypass.damaged-items: true
      airauctions.bypass.blacklist: true
      airauctions.bypass.cooldown: true
      airauctions.bypass.fee: true
      airauctions.bypass.tax: true

  airauctions.bypass.limit:
    description: Bypasses the active listing limit.
    default: op

  airauctions.bypass.expire-time:
    description: Bypasses the listing expiration time.
    default: op

  airauctions.bypass.duration-time:
    description: Bypasses the listing duration time.
    default: op

  airauctions.bypass.gamemodes:
    description: Bypasses blocked gamemode restrictions.
    default: op

  airauctions.bypass.worlds:
    description: Bypasses blocked world restrictions.
    default: op

  airauctions.bypass.damaged-items:
    description: Bypasses the damaged item restriction.
    default: op

  airauctions.bypass.blacklist:
    description: Bypasses the item blacklist.
    default: op

  airauctions.bypass.cooldown:
    description: Bypasses the listing cooldown.
    default: op

  airauctions.bypass.fee:
    description: Bypasses the listing fee.
    default: op

  airauctions.bypass.tax:
    description: Bypasses the sales tax.
    default: op