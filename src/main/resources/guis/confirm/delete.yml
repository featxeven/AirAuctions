# AirAuctions - confirm/delete.yml
# Docs: https://airdevelopment.gitbook.io/docs/

# contexts:
#   Override any combination of fields for a specific source GUI.
#   Key = the GUI id that triggered the confirmation (e.g. target/active).

settings:
  # If disabled, it will fallback to chat confirmation
  enabled: true
  title: "<gradient:#5AD1F2:#736EFE><bold>Confirm Delete</bold></gradient>"
  rows: 3

# --------------------------------------------------
# LAYOUT
# Controls how the listing is displayed.
# --------------------------------------------------
layout:
  # Slots where targeted listing is rendered.
  listing-slots: 13

  # How the targeted listing is rendered inside listing-slots.
  listing:
    lore:
      - "%item_lore%"
      - "=has:airauctions.command.delete <dark_gray>#%id% (Listed @ %date% %time%)"
      - " "
      - "=is:auction <dark_gray>Auction Information"
      - "=is:bid <dark_gray>Bid Information"
      - "<dark_gray> - <gray>Seller: <white>%seller%"
      - "=is:auction <dark_gray> - <gray>Price: %price% (%economy%)"
      - "=is:bid <dark_gray> - <gray>Starting price: %price% (%economy%)"
      - "<dark_gray> - <gray>Amount: <white>x%amount%"
      - "<dark_gray> - <gray>Category: <white>%category%"
    item-flags:
      - HIDE_ATTRIBUTES

# --------------------------------------------------
# ITEMS (base - used when no context overrides items)
# Define the static items rendered in this GUI.
# --------------------------------------------------
items:
  filler:
    template: filler
    slots: [0-8, 18-26]

  confirm:
    slots: 11
    material: LIME_STAINED_GLASS_PANE
    display-name: "<green><bold>Confirm</bold>"
    lore:
      - "<gray>Click to confirm and delete this listing."
    actions:
      any:
        - "[delete]"
        - "=is:valid [sound] $success"
        - "[open] context:true"
    priority:
      # No screen to return to when this GUI was opened directly (e.g. /ah delete)
      - conditions:
          - "%previous_gui% == null"
        actions:
          any:
            - "[delete]"
            - "=is:valid [sound] $success"
            - "[close]"

  cancel:
    slots: 15
    material: RED_STAINED_GLASS_PANE
    display-name: "<red><bold>Cancel</bold>"
    lore:
      - "<gray>Click to cancel and go back."
    actions:
      any:
        - "[open] context:true"
        - "[sound] $deny"
    priority:
      - conditions:
          - "%previous_gui% == null"
        actions:
          any:
            - "[close]"
            - "[sound] $deny"

# --------------------------------------------------
# GUI CONTEXTS
# Override any field based on which GUI triggered the overlay.
# Keys must exactly match the source GUI id.
# --------------------------------------------------
contexts:
  target/active:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Confirm Delete</bold></gradient> <dark_gray>- <white>%seller%'s Listing"

    listing:
      template: card-active

    # The rest is inherited from the base config above unless overridden here.

  target/active|browsing/search:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Confirm Delete</bold></gradient> <dark_gray>- <white>%seller%'s Listing <dark_gray>- <white>\"%query%\""

    listing:
      template: card-active

  target/expired:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Confirm Delete</bold></gradient> <dark_gray>- <white>%seller%'s Expired Listing"

    layout:
      listing:
        template: card-expired

  target/expired|browsing/search:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Confirm Delete</bold></gradient> <dark_gray>- <white>%seller%'s Expired Listing <dark_gray>- <white>\"%query%\""

    layout:
      listing:
        template: card-expired

  target/storage:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Confirm Delete</bold></gradient> <dark_gray>- <white>%seller%'s Storage"

    layout:
      listing:
        template: card-storage

  target/storage|browsing/search:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Confirm Delete</bold></gradient> <dark_gray>- <white>%seller%'s Storage <dark_gray>- <white>\"%query%\""

    layout:
      listing:
        template: card-storage

  player/active:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Confirm Delete</bold></gradient> <dark_gray>- <white>Your Listing"

    listing:
      template: card-active

  player/active|browsing/search:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Confirm Delete</bold></gradient> <dark_gray>- <white>Your Listing <dark_gray>- <white>\"%query%\""

    listing:
      template: card-active

  player/expired:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Confirm Delete</bold></gradient> <dark_gray>- <white>Expired Listing"

    layout:
      listing:
        template: card-expired

  player/expired|browsing/search:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Confirm Delete</bold></gradient> <dark_gray>- <white>Expired Listing <dark_gray>- <white>\"%query%\""

    layout:
      listing:
        template: card-expired

  player/storage:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Confirm Delete</bold></gradient> <dark_gray>- <white>Storage"

    layout:
      listing:
        template: card-storage

  player/storage|browsing/search:
    settings:
      title: "<gradient:#5AD1F2:#736EFE><bold>Confirm Delete</bold></gradient> <dark_gray>- <white>Storage <dark_gray>- <white>\"%query%\""

    layout:
      listing:
        template: card-storage

  browsing/search:
    settings:
