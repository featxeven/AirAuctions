# AirAuctions - Shared GUI Configuration
# Docs: https://airdevelopment.gitbook.io/docs/
#
# Shared resources applied across all GUIs.
# Individual GUIs can override any value defined here.

# ---------------------------------------------------------------
# DEFAULTS
# These values apply to every GUI unless that GUI overrides them.
# ---------------------------------------------------------------
defaults:
  # Trim consecutive empty lore lines.
  trim-lore: true

  # Re-open the GUI instead of refreshing in place.
  # Recommended when the title contains placeholders (e.g. %page%).
  force-reopen: true

  # How often the GUI auto-refreshes. -1 = disabled.
  # Value is in ticks (20 ticks = 1 second).
  refresh-interval: -1

  # Input method used when a player types a value (price, amount, search query).
  # CHAT    - player types in chat
  # SIGN    - player writes on a sign (1.20+)
  # DIALOG  - players writes on a dialog box (1.21.6+) < recommended
  input-type: DIALOG

  # Actions fired when any GUI opens or closes.
  open-actions:
    - "[sound] ui.toast.in 1 2"
    # - "[message] <rainbow>GUI opened!"
  close-actions:
    - "[sound] ui.toast.out 1 2"

# --------------------------------------------------
# ALIASES
# Named strings reusable anywhere on GUIs via $name.
# --------------------------------------------------
aliases:
  click: "ui.button.click 1 1.2"
  success: "entity.player.levelup 1 2"
  deny: "entity.villager.no 1 1"
  page: "item.book.page_turn 1 0.8"
  # message: "<rainbow>Hello!"

# --------------------------------------------------
# TEMPLATES
# Reusable item definitions. Reference in any GUI
# item via: template: <name>
# --------------------------------------------------

#   row-*   Interactive grid card. One per row in a paginated list, carries
#           its own click actions (buy/bid/cancel/claim/collect/delete/...).
#
#   card-*  Read-only preview card, no actions of its own. Used inside confirm
#           GUIs and the shulker/history preview. The SAME template renders the
#           viewer's own listing or someone else's (e.g. confirm/buy.yml uses
#           card-active to preview a listing that is never the viewer's).
#
#   view-bid-card   A read-only card that also keeps a live "click to bid" action.
#                   Only used in browsing/view_bid.yml.

templates:

  # ---------------------------------------------------
  # Structural / filler
  # ---------------------------------------------------

  filler:
    material: BLACK_STAINED_GLASS_PANE
    hide-tooltip: true

  no-listings:
    priority:
      - conditions:
          - "%current% == 0"
        material: BARRIER
        display-name: "<red><bold>Empty"
        lore:
          - "<gray>No listings in this GUI yet."

  switch-listings:
    material: CHEST_MINECART
    display-name: "<white><bold>Your Listings</bold>"
    actions:
      left:
        - "[sound] $click"
        - "[open] gui:player/active page:1 restore:<page:current>"
      right:
        - "[sound] $click"
        - "[open] gui:player/expired page:1 restore:<page:current>"
      left-shift:
        - "[sound] $click"
        - "[open] gui:player/storage page:1 restore:<page:current>"
      right-shift:
        - "[sound] $click"
        - "[open] gui:player/history page:1 restore:<page:current>"

  info-button:
    display-name: "<aqua><bold>Listings</bold>"
    lore:
      - "<dark_gray>Information"
      - " "
      - " <dark_gray>- <gray>Listings: <white>%current% <gray>out of <white>%total%"
      - " <dark_gray>- <gray>Page: <white>%page%<dark_gray>/<white>%pages%"
      - " "
      - "<aqua>Click <gray>to refresh"
    actions:
      any:
        - "[sound] $click"
        - "[refresh]"
    cooldown: 3
    cooldown-message: "<ref:prefix> <red>Wait <white>%timeout%</white> before refreshing this GUI again!"

  search-button:
    material: SPYGLASS
    display-name: "<white><bold>Search</bold>"
    lore:
      - "<dark_gray>Query"
      - " "
      - "<gray>Search within this GUI."
      - " "
      - "<white>Click <gray>to search"
    actions:
      any:
        - "[sound] $click"
        - "[search] page:1 target:current restore:<page:current>"

  # --- Pagination ---
  previous-page:
    material: ARROW
    display-name: "<dark_gray>Previous Page"
    lore:
      - "<red>First page reached."
    priority:
      - conditions:
          - "%has_previous_page% == true"
        material: SPECTRAL_ARROW
        display-name: "<aqua>Previous Page"
        lore:
          - "<gray>Return to the previous page."
        actions:
          any:
            - "[sound] $page"
            - "[page] to:previous"
        cooldown: 0.2

  next-page:
    material: ARROW
    display-name: "<dark_gray>Next Page"
    lore:
      - "<red>Last page reached."
    priority:
      - conditions:
          - "%has_next_page% == true"
        material: SPECTRAL_ARROW
        display-name: "<aqua>Next Page"
        lore:
          - "<gray>Navigate to the next page."
        actions:
          any:
            - "[sound] $page"
            - "[page] to:next"
        cooldown: 0.2

  # --- Sort ---
  sort-active:
    material: COMPARATOR
    display-name: "<aqua><bold>Sort</bold>"
    lore:
      - "<dark_gray>Order"
      - " "
      - "<gray>Sorting: <white>%sort_ACTIVE%"
      - " "
      - "%sort_ACTIVE_list%"
      - " "
      - "<aqua>Click <gray>to cycle"
    actions:
      left:
        - "[sound] $click"
        - "[sort] by:active to:next"
      right:
        - "[sound] $click"
        - "[sort] by:active to:previous"
    cooldown: 0.2

  sort-unclaimed:
